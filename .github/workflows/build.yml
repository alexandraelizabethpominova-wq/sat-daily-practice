name: Build, Migrate, and Deploy

on:
  push:
    branches:
      - main
      - 'ui/**'
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Guard PR-only Supabase SQL
        shell: bash
        run: |
          set -euo pipefail

          if find supabase/migrations -maxdepth 1 -type f \( -name '*_pr_*' -o -name '*.pr.sql' \) | grep -q .; then
            echo "::error::PR-only SQL must live in supabase/pr-migrations, never supabase/migrations."
            exit 1
          fi

          mapfile -t PR_SQL < <(find supabase/pr-migrations -maxdepth 1 -type f -name '*.sql' 2>/dev/null | sort || true)

          if [ "${#PR_SQL[@]}" -gt 0 ]; then
            printf 'PR-only Supabase SQL found:\n%s\n' "${PR_SQL[*]}"

            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::PR-only database SQL cannot be merged to main. Promote it to a real migration or remove it first."
              exit 1
            fi

            if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "${{ github.event.pull_request.draft }}" != "true" ]; then
              echo "::error::PR-only database SQL is allowed only while the PR is draft. Remove it or promote it before review/merge."
              exit 1
            fi

            echo "::notice::PR-only database SQL is isolated from production migration history."
          fi


      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: gnhmfhvvirpgawijsrej
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending migrations
        run: supabase db push --dry-run

      - name: Apply pending migrations
        run: supabase db push

      - name: Deploy SAT source proxy
        run: supabase functions deploy sat-question-source --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Verify migration history is deployable
        run: |
          supabase migration list
          supabase db push --dry-run

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs:
      - build
      - migrate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
